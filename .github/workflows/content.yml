name: 자동 콘텐츠 파이프라인

# 매일 한국시간 오전 9시(UTC 00:00)에 실행됩니다.
# 발행량은 automation.config.ts의 램프 설정이 자동으로 조절합니다.
#   글 30개 미만 → 회당 10개 / 100개 미만 → 6개 / 300개 미만 → 3개 / 이후 → 2개
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "이번 실행에서 생성할 초안 개수 (비우면 램프 설정 사용)"
        required: false
        type: string
      provider:
        description: "AI 프로바이더"
        required: false
        default: "anthropic"
        type: choice
        options: [anthropic, openai, grok]

# 동시 실행을 막아 같은 키워드가 중복 처리되는 것을 방지합니다.
concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 파이프라인 실행
        env:
          AI_PROVIDER: ${{ inputs.provider || 'anthropic' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
        run: |
          if [ -n "${{ inputs.count }}" ]; then
            npm run pipeline -- --count "${{ inputs.count }}"
          else
            npm run pipeline
          fi

      - name: 검토 대기 목록을 실행 요약에 기록
        if: always()
        run: |
          {
            echo "## 검토가 필요한 초안"
            echo ""
            echo '```'
            npm run review --silent || true
            echo '```'
            echo ""
            echo "로컬에서 확인 후 발행:"
            echo '```bash'
            echo "git pull && npm run review -- --publish <슬러그>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 초안 커밋
        run: |
          git config user.name  "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          # search-index.json은 Vercel 빌드 시 재생성되므로 커밋하지 않습니다.
          git add content/posts data/keywords.csv
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          COUNT=$(git diff --staged --name-only --diff-filter=A -- content/posts | wc -l)
          git commit -m "content: 초안 ${COUNT}개 자동 생성

          검토 후 draft:false 로 변경해야 사이트에 노출됩니다."
          git push
