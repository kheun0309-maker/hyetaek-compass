name: 자동 콘텐츠 파이프라인

# 매일 한국시간 오전 9시 17분. GitHub 예약 실행은 지연될 수 있습니다.
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "AI 초안 개수 (비우면 출처만 갱신; 자동 AI는 저장소 변수로 설정)"
        required: false
        type: string
      provider:
        description: "AI 프로바이더 (초안 생성을 켠 경우)"
        required: false
        default: "auto"
        type: choice
        options: [auto, openai, anthropic, grok]

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 출처 수집 및 소식 갱신 (AI 키 불필요)
        id: sources
        run: npm run refresh:sources

      - name: 선택적 AI 초안 생성
        id: ai
        if: vars.CONTENT_GENERATION_ENABLED == 'true' || inputs.count != ''
        continue-on-error: true
        env:
          PIPELINE_COUNT: ${{ inputs.count }}
          AI_PROVIDER: ${{ inputs.provider != 'auto' && inputs.provider || vars.AI_PROVIDER || 'openai' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
        run: |
          case "$AI_PROVIDER" in
            openai) KEY="$OPENAI_API_KEY" ;;
            anthropic) KEY="$ANTHROPIC_API_KEY" ;;
            grok) KEY="$XAI_API_KEY" ;;
            *) echo "::error::알 수 없는 AI_PROVIDER"; exit 1 ;;
          esac
          if [ -z "$KEY" ]; then
            echo "::error::선택한 AI의 GitHub Secret이 없습니다. 출처 갱신은 계속합니다."
            exit 1
          fi
          if [ -n "$PIPELINE_COUNT" ]; then
            npm run pipeline -- --count "$PIPELINE_COUNT"
          else
            npm run pipeline
          fi

      - name: 타입·회귀 검사 및 정적 빌드
        run: |
          npm run check
          npm run build:static

      - name: 검증된 소식과 초안 저장
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add content/posts data/topics data/keywords.csv
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
            exit 0
          fi
          git commit -m "content: 출처 목록 갱신 및 검증된 콘텐츠 저장"
          git push

      - name: 수집 상태·검토 대기 요약
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.sources.outcome }}
          AI_OUTCOME: ${{ steps.ai.outcome }}
        run: |
          {
            echo "## 출처 갱신: $SOURCE_OUTCOME / AI 초안: $AI_OUTCOME"
            echo '```'
            node -e 'const d=require("./data/topics/seoraksan.json"); console.log("마지막 수집:",d.collectedAt); for(const c of d.checks) console.log(c.sourceId,c.status,c.count,"건", "마지막 성공:",c.checkedAt || "없음");'
            npm run review --silent
            echo '```'
            echo "AI 초안은 검토 전 공개되지 않습니다. 소식은 제목·게시일·원문 링크만 갱신합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-checks
          path: data/topics/seoraksan.json
          retention-days: 14

      - name: AI 실패를 실행 결과에 반영
        if: steps.ai.outcome == 'failure'
        run: |
          echo "::error::AI 초안 생성 실패. 검증을 통과한 출처 갱신은 저장되었습니다. 실행 요약을 확인하세요."
          exit 1
