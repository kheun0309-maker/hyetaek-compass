name: Cloudflare Pages 배포 (Direct Upload)

# 방법 A(Cloudflare Pages ↔ Git 연동)를 쓰면 이 워크플로는 필요 없습니다.
# Cloudflare가 push를 감지해 알아서 빌드합니다.
#
# Direct Upload(wrangler) 방식으로만 수동 배포할 때 사용하세요.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
on:
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 정적 빌드
        run: npm run build

      - name: Cloudflare Pages 업로드
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy out --project-name="${{ vars.CF_PAGES_PROJECT || 'hyetaek-compass' }}" --branch=main
